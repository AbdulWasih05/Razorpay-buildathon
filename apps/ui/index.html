      into `apps/ui/public/`, which Vite copies into the bundle. The card's

      is the last place anyone would notice.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Praman" />
    <meta
      property="og:title"
      content="Praman | Agentic Dispute Defense"
    />
    <meta
      property="og:description"
      content="Agentic evidence is captured at transaction time. By dispute time it is gone. Defense only: a deterministic gate decides contest-or-abstain, and only a named human can submit."

      property="og:image:alt"
      content="Praman — agentic evidence is captured at transaction time. The card carries recall on the dev set and on the held-out set, the distribution shift between them, and how many disputes were scored. The figures themselves are not restated here, so they cannot go stale against eval/results.md."
    />
